openapi: 3.0.3
info:
  title: API Locadora de Filmes
  version: 1.0.10.25
  description: |
    API responsável pelo CRUD de filmes, atores, diretores, produtores, personagens e gêneros de uma locadora.
    
    **Desenvolvedor:** Gustavo Pereira
    **Base URL:** /v1/locadora
  contact:
    email: guga20.leite@gmail.com
servers:
  - url: http://localhost:8080
    description: Servidor Local

tags:
  - name: Filme
    description: Gestão do catálogo de filmes (incluindo relações com atores e gêneros)
  - name: Gênero
    description: Categorias dos filmes
  - name: Ator
    description: Gestão de atores e atrizes
  - name: Diretor
    description: Gestão de diretores de cinema
  - name: Produtora
    description: Empresas produtoras de filmes
  - name: Personagem
    description: Personagens interpretados nos filmes

paths:
  # ==========================================
  # DOMÍNIO: FILME
  # Base: /v1/locadora/filme
  # ==========================================
  /v1/locadora/filme:
    get:
      tags:
        - Filme
      summary: Lista todos os filmes
      description: Retorna a lista de filmes com seus respectivos gêneros e elenco.
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseFilmeList'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Filme
      summary: Cadastra novo filme
      description: Insere um filme e suas relações (gêneros e atores/personagens). Requer JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilmeInput'
      responses:
        '201':
          description: Criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseFilmeSingle'
        '200':
          description: Criado com ressalvas (Erro na tabela de relação)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/locadora/filme/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags:
        - Filme
      summary: Busca filme por ID
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseFilmeSingle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Filme
      summary: Atualiza filme
      description: Atualiza dados do filme e recria as relações de gênero e elenco.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilmeInput'
      responses:
        '200':
          description: Atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseFilmeSingle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Filme
      summary: Deleta filme
      responses:
        '200':
          $ref: '#/components/responses/SuccessGeneric'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

