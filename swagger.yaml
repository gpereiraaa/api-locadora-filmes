# ==========================================
# COMPONENTES
# ==========================================
components:
  parameters:
    IdPath:
      name: id
      in: path
      description: ID numérico único do registro
      required: true
      schema:
        type: integer
        format: int64
        example: 5

  schemas:
    # --- ENVELOPE PADRÃO ---
    GenericResponse:
      type: object
      description: Estrutura padrão de resposta da API
      properties:
        development:
          type: string
          description: Nome do desenvolvedor
          example: "Gustavo Pereira"
        api_description:
          type: string
          description: Descrição da API
          example: "API para manipular dados da locadora de filmes"
        version:
          type: string
          description: Versão atual
          example: "1.0.10.25"
        request_date:
          type: string
          description: Data da requisição
          example: "07/10/2025"
        status:
          type: boolean
          description: Status da operação
          example: true
        status_code:
          type: integer
          description: Código HTTP
          example: 200
        message:
          type: string
          description: Mensagem descritiva
          example: "Requisição bem sucedida!!!"

    # --- FILME ---
    FilmeData:
      type: object
      description: Dados detalhados do filme
      properties:
        id:
          type: integer
          description: ID do filme
          example: 10
        nome:
          type: string
          description: Título do filme
          example: "Velozes e Furiosos"
        sinopse:
          type: string
          description: Sinopse do filme
          example: "Brian O'Conner é um policial..."
        data_lancamento:
          type: string
          description: Data de lançamento (YYYY-MM-DD)
          example: "2001-06-22"
        duracao:
          type: string
          description: Duração do filme
          example: "01:46:00"
        orcamento:
          type: number
          description: Valor do orçamento
          example: 38000000
        trailer:
          type: string
          description: URL do trailer
          example: "https://youtube.com/..."
        capa:
          type: string
          description: URL da capa do filme
          example: "https://imagem.com/capa.jpg"
        genero:
          type: array
          description: Lista de gêneros associados
          items:
            $ref: '#/components/schemas/GeneroData'
        ator:
          type: array
          description: Lista de elenco associado
          items:
            type: object
            description: Relação Filme-Ator-Personagem
            properties:
              id:
                type: integer
                description: ID da relação
              id_filme:
                type: integer
                description: ID do filme
              id_ator:
                type: integer
                description: ID do ator
              id_personagem:
                type: integer
                description: ID do personagem
    
    FilmeInput:
      type: object
      description: Dados para criação/atualização de filme
      required: [nome, sinopse, data_lancamento, duracao, orcamento, trailer, capa]
      properties:
        nome:
          type: string
          description: Título do filme
          example: "Velozes e Furiosos"
        sinopse:
          type: string
          description: Sinopse
          example: "Brian O'Conner é um policial..."
        data_lancamento:
          type: string
          description: Data de lançamento (YYYY-MM-DD)
          example: "2001-06-22"
        duracao:
          type: string
          description: Duração (HH:mm:ss)
          example: "01:46:00"
        orcamento:
          type: number
          description: Valor do orçamento
          example: 38000000
        trailer:
          type: string
          description: URL do trailer
          example: "https://youtube.com/..."
        capa:
          type: string
          description: URL da imagem de capa
          example: "https://imagem.com/capa.jpg"
        genero:
          type: array
          description: Lista de IDs dos gêneros
          items:
            type: object
            properties:
              id:
                type: integer
                description: ID do gênero
                example: 1
        ator_personagem:
          type: array
          description: Lista de relações ator-personagem
          items:
            type: object
            properties:
              idAtor:
                type: integer
                description: ID do ator
                example: 5
              idPersonagem:
                type: integer
                description: ID do personagem
                example: 2

    ResponseFilmeList:
      allOf:
        - $ref: '#/components/schemas/GenericResponse'
        - type: object
          properties:
            response:
              type: object
              description: Payload de resposta
              properties:
                films:
                  type: array
                  description: Lista de filmes
                  items:
                    $ref: '#/components/schemas/FilmeData'

    ResponseFilmeSingle:
      allOf:
        - $ref: '#/components/schemas/GenericResponse'
        - type: object
          properties:
            response:
              type: object
              description: Payload de resposta
              properties:
                film:
                  $ref: '#/components/schemas/FilmeData'

    # --- GÊNERO ---
    GeneroData:
      type: object
      description: Dados do gênero
      properties:
        id:
          type: integer
          description: ID do gênero
          example: 1
        nome:
          type: string
          description: Nome do gênero
          example: "Ação"
        descricao:
          type: string
          description: Descrição do gênero
          example: "Filmes com muitas explosões"

    GeneroInput:
      type: object
      description: Input para gênero
      required: [nome, descricao]
      properties:
        nome:
          type: string
          description: Nome do gênero
          example: "Ação"
        descricao:
          type: string
          description: Descrição do gênero
          example: "Filmes de ação"

    ResponseGeneroList:
      allOf:
        - $ref: '#/components/schemas/GenericResponse'
        - type: object
          properties:
            response:
              type: object
              description: Payload de resposta
              properties:
                generos:
                  type: array
                  description: Lista de gêneros
                  items:
                    $ref: '#/components/schemas/GeneroData'

    ResponseGeneroSingle:
      allOf:
        - $ref: '#/components/schemas/GenericResponse'
        - type: object
          properties:
            response:
              type: object
              description: Payload de resposta
              properties:
                genero:
                  $ref: '#/components/schemas/GeneroData'

    # --- ATOR ---
    AtorData:
      type: object
      description: Dados do ator
      properties:
        id:
          type: integer
          description: ID do ator
        nome:
          type: string
          description: Nome do ator
        nacionalidade:
          type: string
          description: Nacionalidade
        sexo:
          type: string
          description: Gênero
        data_nascimento:
          type: string
          description: Data de nascimento
        foto:
          type: string
          description: URL da foto
        altura:
          type: number
          description: Altura em metros
        biografia:
          type: string
          description: Biografia resumida

    AtorInput:
      type: object
      description: Input para ator
      required: [nome, nacionalidade, sexo, data_nascimento, foto, altura, biografia]
      properties:
        nome:
          type: string
          description: Nome completo
          example: "Paul Walker"
        nacionalidade:
          type: string
          description: País de origem
          example: "Americano"
        sexo:
          type: string
          description: Gênero
          example: "Masculino"
        data_nascimento:
          type: string
          description: Data de nascimento (YYYY-MM-DD)
          example: "1973-09-12"
        foto:
          type: string
          description: URL da foto
          example: "https://imagem.com/paul.jpg"
        altura:
          type: number
          description: Altura em metros
          example: 1.88
        biografia:
          type: string
          description: Texto biográfico
          example: "Foi um ator norte-americano..."

    ResponseAtorList:
      allOf:
        - $ref: '#/components/schemas/GenericResponse'
        - type: object
          properties:
            response:
              type: object
              description: Payload de resposta
              properties:
                atores:
                  type: array
                  description: Lista de atores
                  items:
                    $ref: '#/components/schemas/AtorData'

    ResponseAtorSingle:
      allOf:
        - $ref: '#/components/schemas/GenericResponse'
        - type: object
          properties:
            response:
              type: object
              description: Payload de resposta
              properties:
                ator:
                  $ref: '#/components/schemas/AtorData'

    # --- DIRETOR ---
    DiretorData:
      type: object
      description: Dados do diretor (estrutura idêntica a Ator)
      properties:
        id_diretor:
          type: integer
          description: ID do diretor
        nome:
          type: string
          description: Nome
        nacionalidade:
          type: string
          description: Nacionalidade
        sexo:
          type: string
          description: Sexo
        data_nascimento:
          type: string
          description: Data nascimento
        foto:
          type: string
