openapi: 3.0.3
info:
  title: Projeto API locadora de filmes - Gustavo Pereira
  description: |-
   API destinada a controle de filmes de locadora
  termsOfService: http://swagger.io/terms/
  contact:
    email: guga20.leite@gmail.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
  - url: http://localhost:8080
paths:
  /v1/locadora/filme:
    post:
      tags:
        - Filme
      summary: Insere um novo filme
      description: Adiciona um novo filme
      requestBody:
        description: JSON contendo os dados do novo filme a ser inserido no sistema
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Filme'
        required: true
      responses:
        '201':
          description: Successful operation
        '400':
          description: Invalid input
        '500':
          description: Error internal server
        '415':
          description: Error content-type
    get:
      tags:
        - Filme
      summary: Lista todos os filmes
      description: Listagem de todos os filmes registrados no sistema
      responses:
        '200':
          description: successful operation
        '404':
          description: NOT FOUND
        '500':
          description: Error internal server
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Filme'
  /v1/locadora/filme/{id}:
    get:
      tags:
        - Filme
      summary: Busca um filme pelo ID
      description: Retorna um filme pelo ID
      parameters:
        - name: id
          in: path
          description: ID do filme
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filme'          
        '400':
          description: Invalid input
        '404':
          description: Not Found
        '500':
          description: Error internal server
    put:
      tags:
        - Filme
      summary: Atualiza um filme existente
      description: Atualiza um filme existente pelo Id
      parameters:
        - name: id
          in: path
          description: ID do filme
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Atualiza um filme existente no Banco de dados
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Filme'
        required: true
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid input
        '404':
          description: NOT FOUND
        '415':
          description: Error content-type
        '500':
          description: Error internal server
       
    delete:
      tags:
        - aluno
      summary: Delete aluno
      description: Excluir um aluno
      parameters:
        - name: id
          in: path
          description: ID of pet to return
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: Pet not found
components:
  schemas:
    Filme:
      required:
        - nome
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        sinopse:
          type: string
        data_lancamento:
          type: string
        duracao:
          type: string
        orcamento:
          type: number
        trailer:
          type: string
        capa:
          type: string
  requestBodies:
    Filme:
      description: Objeto que deve ser enviado no Body das requisicoes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Aluno'
    
