  responses:
    SuccessGeneric:
      description: Operação realizada com sucesso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericResponse'
    BadRequest:
      description: 'Requisição Inválida (Campos obrigatórios ou tipo de dados)'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/GenericResponse'
              - type: object
                properties:
                  status_code:
                    example: 400
                    description: Código de erro HTTP
                  message:
                    example: "Não foi possível processar a requisição devido a campos inválidos"
                    description: Detalhe do erro
    NotFound:
      description: Registro não encontrado
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/GenericResponse'
              - type: object
                properties:
                  status_code:
                    example: 404
                    description: Código de erro HTTP
                  message:
                    example: "Não foram encontrados dados de retorno!!!"
                    description: Detalhe do erro
    UnsupportedMediaType:
      description: 'Tipo de conteúdo inválido (JSON obrigatório)'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/GenericResponse'
              - type: object
                properties:
                  status_code:
                    example: 415
                    description: Código de erro HTTP
                  message:
                    example: "Content-Type inválido, deve ser application/json"
                    description: Detalhe do erro
    InternalServerError:
      description: Erro interno no servidor ou banco de dados
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/GenericResponse'
              - type: object
                properties:
                  status_code:
                    example: 500
                    description: Código de erro HTTP
                  message:
                    example: "Erro interno no servidor controller/model"
                    description: Detalhe do erro